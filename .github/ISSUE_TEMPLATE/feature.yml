name: 功能建议
description: 提议不突破离线演示边界的新功能
title: "[建议] "
labels: ["enhancement", "待讨论"]
body:
  - type: textarea
    id: need
    attributes:
      label: 用户问题
      description: 请描述要解决的问题，而不是只描述按钮。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请说明数据从哪里来、如何标记 DEMO、失败时如何显示。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及区域
      options:
        - 产品检索
        - 属具匹配
        - 报价试算
        - HS 与税费
        - 文档与质量
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: 数据边界
      options:
        - label: 方案不要求把真实商业数据或访问材料加入仓库
          required: true
        - label: 方案不会把示例税率、价格或匹配结论冒充实时事实
          required: true
