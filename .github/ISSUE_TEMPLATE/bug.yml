name: 错误报告
description: 报告可复现的开源演示版问题
title: "[错误] "
labels: ["bug", "待确认"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请只使用虚构数据复现，不要上传真实账号、客户、产品、价格、日志或截图。
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 实际发生了什么？你预期什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      placeholder: |
        1. 打开……
        2. 选择……
        3. 输入虚构值……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: v1.0.0
  - type: input
    id: browser
    attributes:
      label: 浏览器与操作系统
      placeholder: Chrome / Windows
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已移除所有真实或敏感数据
          required: true
        - label: 我已运行 pnpm run ci，或说明无法运行的原因
          required: true
