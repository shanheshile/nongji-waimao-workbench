version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      frontend-tooling:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "typescript"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
