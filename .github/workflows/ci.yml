name: 持续集成

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 开源边界、测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 设置 pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (peeled commit)
        with:
          version: 11.19.0
          run_install: false

      - name: 启用依赖缓存
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile

      - name: 运行完整校验
        run: pnpm run ci
